function icon(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.dots}</svg>`;}

function hasFirebaseSdk(){
  return typeof window.firebase !== 'undefined' && typeof window.firebase.initializeApp === 'function';
}
function hasValidFirebaseConfig(){
  return firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY' && firebaseConfig.projectId && firebaseConfig.projectId !== 'YOUR_PROJECT';
}
async function ensureFirebase(){
  if(firebaseReady) return true;
  if(!hasFirebaseSdk() || !hasValidFirebaseConfig()) return false;
  try{
    if(!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
    auth = window.firebase.auth();
    db = window.firebase.firestore();
    // ИСПРАВЛЕНИЕ "INTERNAL ASSERTION FAILED: Unexpected state":
    // старый enablePersistence({synchronizeTabs:true}) конфликтует с обрывами
    // WebChannel-стрима (нестабильная сеть, debug по Wi-Fi, DPI) — именно это
    // вызывает внутренний краш SDK во время записи. Настраиваем офлайн-кэш и
    // сетевой транспорт через db.settings() ДО первого использования db —
    // это единственный современный способ и одновременно устраняет
    // deprecation-warning про enableMultiTabIndexedDbPersistence.
    db.settings({
      cache: {
        kind: 'persistent',
        tabManager: { kind: 'multiple' }
      },
      experimentalAutoDetectLongPolling: true,
      merge: true
    });
    firebaseReady = true;
    return true;
  }catch(e){
    console.warn('Firebase bootstrap failed', e);
    return false;
  }
}

      this.restoreLocalState();
      this.loading = false;
      this.booting = false;
      this.startupStatus = '';
      this.isOnline = false;
      this.$nextTick(() => this.renderChart());
      setTimeout(() => this.checkRealConnectivity(), 0);
      this._pingTimer = setInterval(() => this.checkRealConnectivity(), 15000);
      window.addEventListener('online', () => this.checkRealConnectivity());
      window.addEventListener('offline', () => {
        this.isOnline = false;
        this.toast('Нет подключения к интернету');
      });
      setTimeout(() => this.startFirebaseFlow(), 0);
    },
    restoreLocalState(){
      this._restoringPendingQueue = true;
      const savedQueue = lsGet(LS_KEYS.queue, []);
      const savedCatId = lsGet(LS_KEYS.lastCat, null);
      const cachedExpenses = lsGet(LS_KEYS.expensesCache, []);
      const cachedWorkspace = lsGet(LS_KEYS.workspaceCache, null);
      if(savedCatId) this.form.catId = savedCatId;
      if(cachedWorkspace){
        this.workspaceId = cachedWorkspace.workspaceId || this.workspaceId;
        this.baseCurrency = cachedWorkspace.baseCurrency || this.baseCurrency;
        if(Array.isArray(cachedWorkspace.categories) && cachedWorkspace.categories.length) this.categories = cachedWorkspace.categories;
      }
      this.expenses = Array.isArray(cachedExpenses) ? cachedExpenses : [];
      if(savedQueue.length){
        this.pendingQueue = savedQueue;
        const pendingRows = savedQueue.map(p => ({ id: p._localId, ...p, _pending: true }));
        const existingIds = new Set(this.expenses.map(e => e.id));
        pendingRows.forEach(row => { if(!existingIds.has(row.id)) this.expenses.unshift(row); });
      }
      this._restoringPendingQueue = false;
    },
    async startFirebaseFlow(){
      this.startupStatus = 'Подключаем локальную базу…';
      const ready = await ensureFirebase();
      this.firebaseEnabled = ready;
      if(!ready){
        this.startupStatus = this.isOnline ? 'Firebase недоступен' : 'Оффлайн: показаны локальные данные';
        return;
      }
      this.startupStatus = this.isOnline ? 'Синхронизация…' : 'Оффлайн: показаны локальные данные';
      auth.onAuthStateChanged(async (u) => {
        this.user = u;
        this.loading = false;
        if(u){ await this.loadWorkspace(); }
      });
    },
    today(){ return new Date().toISOString().slice(0,10); },
    toast(msg){ this.toastMsg = msg; setTimeout(()=>this.toastMsg='', 2200); },
    async manualRefresh(){
      if(this.refreshing) return;
      this.refreshing = true;
      const withTimeout = (promise, ms) => Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
      try{
        const online = await withTimeout(this.checkRealConnectivity(), 3000);
        if(online){
          await withTimeout(this.flushPendingQueue(), 5000).catch(()=>{});
          if(this.workspaceId) await withTimeout(this.loadWorkspace(), 5000).catch(()=>{});
          if(navigator.serviceWorker && navigator.serviceWorker.controller){
            navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
          }
          this.toast('Обновлено');
        }else{
          this.toast('Нет подключения — показаны локальные данные');
        }
      }catch(e){
        this.toast('Не удалось обновить');
      }finally{
        this.refreshing = false;
      }
    },
    toggleTheme(){ this.theme = this.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', this.theme); },

    async checkRealConnectivity(){
      const wasOnline = this.isOnline;
      if(!navigator.onLine){
        this.isOnline = false;
        if(wasOnline) this.toast('Нет подключения к интернету');
        return false;
      }
      let online = false;
      try{
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1800);
        const res = await fetch(`./manifest.json?_=${Date.now()}`, { cache:'reload', signal: controller.signal });
        clearTimeout(timeoutId);
        online = !!res;
      }catch(e){
        online = false;
      }
      this.isOnline = online;
      if(!wasOnline && this.isOnline){
        this.toast('Соединение восстановлено');
        this.flushPendingQueue();
      }else if(wasOnline && !this.isOnline){
        this.toast('Нет подключения к интернету');
      }
      return this.isOnline;
    },
    async flushPendingQueue(){
      if(!this.pendingQueue.length || !this.workspaceId) return;
      const toSync = [...this.pendingQueue];
      this.pendingQueue = [];
      for(const payload of toSync){
        const { _localId, createdAtLocal, ...cleanPayload } = payload;
        try{
          await db.collection('workspaces').doc(this.workspaceId).collection('expenses').add({
            ...cleanPayload, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }catch(e){
          this.pendingQueue.push(payload);
        }
      }
      this.expenses = this.expenses.filter(e => !e._pending);
      if(this.pendingQueue.length){
        lsSet(LS_KEYS.queue, this.pendingQueue);
      }else{
        lsRemove(LS_KEYS.queue);
      }
      if(toSync.length && !this.pendingQueue.length) this.toast('Синхронизировано');
    },

    attachListeners(){
      this.loadFxTrades();
      db.collection('workspaces').doc(this.workspaceId).onSnapshot(doc=>{
        if(!doc.exists) return;
        const d = doc.data();
        this.baseCurrency = d.baseCurrency || 'EUR';
        if(d.categories && d.categories.length) this.categories = d.categories;
        lsSet(LS_KEYS.workspaceCache, { workspaceId:this.workspaceId, baseCurrency:this.baseCurrency, categories:this.categories });
        this.recalcAll();
      });
      db.collection('workspaces').doc(this.workspaceId).collection('expenses').orderBy('date','desc').onSnapshot(snap=>{
        const remoteExpenses = snap.docs.map(d=>({id:d.id, ...d.data()}));
         remoteExpenses.sort((a, b) => { if(a.date !== b.date) return a.date < b.date ? 1 : -1;
          const at = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
          const bt = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
          return bt - at;
        });
        const pendingRows = this.pendingQueue.map(p => ({ id: p._localId, ...p, _pending: true }));
        this.expenses = [...pendingRows, ...remoteExpenses];
        lsSet(LS_KEYS.expensesCache, this.expenses.filter(e => !e._pending));
        this.$nextTick(()=>this.renderChart());
      });
    },

    toCents(amount){ return Math.round(Number(amount) * 100); },
    fromCents(cents){ return cents / 100; },
    buildFxGraph(){
      const graph = {};
      const pairTotals = {};
      this.fxTrades.forEach(t=>{
        const from = (t.fromCurrency||'').toUpperCase();
        const to = (t.toCurrency||'').toUpperCase();
        const fromAmount = Number(t.fromAmount);
        const toAmount = Number(t.toAmount);
        if(!from || !to || !fromAmount || !toAmount || from===to) return;
        const key = from+'|'+to;
        if(!pairTotals[key]) pairTotals[key] = { totalFrom:0, totalTo:0 };
        pairTotals[key].totalFrom += fromAmount;
        pairTotals[key].totalTo += toAmount;
      });
      Object.entries(pairTotals).forEach(([key, {totalFrom, totalTo}])=>{
        const [from, to] = key.split('|');
        if(!graph[from]) graph[from] = {};
        if(!graph[to]) graph[to] = {};
        if(totalFrom > 0) graph[from][to] = totalTo/totalFrom;
        if(totalTo > 0) graph[to][from] = totalFrom/totalTo;
      });
      return graph;
    },
    findFxRate(fromCurrency, toCurrency){
      const from = (fromCurrency||'').toUpperCase();
      const to = (toCurrency||'').toUpperCase();
      if(!from || !to) return null;
      if(from === to) return 1;
      const graph = this.buildFxGraph();
      if(!graph[from]) return null;
      const visited = new Set([from]);
      const queue = [{ cur: from, rate: 1 }];
      while(queue.length){
        const { cur, rate } = queue.shift();
        const neighbors = graph[cur] || {};
        for(const [next, edgeRate] of Object.entries(neighbors)){
          if(visited.has(next)) continue;
          const newRate = rate * edgeRate;
          if(next === to) return newRate;
          visited.add(next);
          queue.push({ cur: next, rate: newRate });
        }
      }
      return null;
    },
    convertToBase(amount, fromCurrency){
      const from = (fromCurrency||'').toUpperCase();
      const to = (this.baseCurrency||'').toUpperCase();
      if(from === to) return Number(amount);
      const rate = this.findFxRate(from, to);
      if(rate === null) return null;
      return Number(amount) * rate;
    },
    async loadFxTrades(){
      if(!db || !this.workspaceId){ console.error('[loadFxTrades] db или workspaceId не готовы', {db:!!db, workspaceId:this.workspaceId}); return; }
      db.collection('workspaces').doc(this.workspaceId).collection('fxTrades')
        .onSnapshot(snap=>{
          this.fxTrades = snap.docs.map(d=>({id:d.id, ...d.data()}))
            .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
          console.log('[loadFxTrades] загружено записей:', this.fxTrades.length);
          this.recalcAll();
        }, err => {
          console.error('[loadFxTrades] ошибка snapshot:', err);
          this.toast('Не удалось загрузить курсы обмена: '+err.message);
        });
    },

    async submitFx(){
      if(this.fxSaving) return;
      const fromAmount = parseFloat(this.newFx.fromAmount);
      const toAmount = parseFloat(this.newFx.toAmount);
      if(!this.newFx.fromCurrency || !this.newFx.toCurrency){ this.toast('Выберите обе валюты'); return; }
      if(this.newFx.fromCurrency === this.newFx.toCurrency){ this.toast('Валюты должны отличаться'); return; }
      if(!fromAmount || isNaN(fromAmount) || fromAmount <= 0){ this.toast('Введите сумму продажи'); return; }
      if(!toAmount || isNaN(toAmount) || toAmount <= 0){ this.toast('Введите сумму покупки'); return; }
      if(!this.newFx.date || !/^\d{4}-\d{2}-\d{2}$/.test(this.newFx.date)){ this.toast('Укажите дату в формате ГГГГ-ММ-ДД'); return; }
      if(!this.user || !this.user.uid){ this.toast('Профиль пользователя ещё не готов, попробуйте через секунду'); console.error('[submitFx] user не готов', this.user); return; }
      if(!db){ this.toast('Нет подключения к базе данных'); console.error('[submitFx] db is null'); return; }
      if(!this.workspaceId){ this.toast('Рабочее пространство не готово'); console.error('[submitFx] workspaceId is null'); return; }
      this.fxSaving = true;
      try{
        if(auth && auth.currentUser) await auth.currentUser.getIdToken(true);
      }catch(e){
        console.warn('Не удалось обновить токен', e);
      }
      const payload = {
        fromCurrency: this.newFx.fromCurrency,
        fromAmountCents: this.toCents(fromAmount),
        fromAmount,
        toCurrency: this.newFx.toCurrency,
        toAmountCents: this.toCents(toAmount),
        toAmount,
        date: this.newFx.date,
        createdBy: this.user.uid
      };
      console.log('[submitFx] сохраняем', payload);
      const timeoutMs = 10000;
      let timedOut = false;
      const timeoutId = setTimeout(()=>{
        timedOut = true;
        this.fxSaving = false;
        this.toast('Превышено время ожидания сервера. Проверьте сеть и попробуйте снова.');
        console.error('[submitFx] таймаут ожидания ответа Firestore (>'+timeoutMs+'мс)');
      }, timeoutMs);
      try{
        await db.collection('workspaces').doc(this.workspaceId).collection('fxTrades').add({
          ...payload, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        clearTimeout(timeoutId);
        if(timedOut) return;
        this.showFxForm = false;
        this.toast('Курс обмена сохранён');
      }catch(e){
        clearTimeout(timeoutId);
        console.error('[submitFx] Firestore add() упал:', e);
        this.toast('Ошибка сохранения: '+(e && e.message ? e.message : 'неизвестная ошибка'));
      }finally{
        clearTimeout(timeoutId);
        if(!timedOut) this.fxSaving = false;
      }
    },

    async submitExpense(){

        amount, amountCents: this.toCents(amount), currency:this.form.currency,

        comment:this.form.comment||'', method:this.form.method, createdBy:this.user.uid
      };
      lsSet(LS_KEYS.lastCat, this.form.catId);

      if(!this.isOnline){
        const pendingId = 'pending_'+Date.now();
        const payload = { ...basePayload, createdAtLocal: Date.now(), _localId: pendingId };
        this.pendingQueue.push(payload);
        lsSet(LS_KEYS.queue, this.pendingQueue);
        this.expenses = [{ id: pendingId, ...payload, _pending: true }, ...this.expenses];

        this.pendingQueue.push(payload);

    async deleteExpense(id){
      if(String(id).startsWith('pending_')){
        this.expenses = this.expenses.filter(e => e.id !== id);
        this.pendingQueue = this.pendingQueue.filter(p => p._localId !== id);
        if(this.pendingQueue.length) lsSet(LS_KEYS.queue, this.pendingQueue); else lsRemove(LS_KEYS.queue);
        this.toast('Отложенная запись удалена');

    get filteredExpenses(){
      let list = [...this.expenses];
      if(this.filterCat!=='all') list = list.filter(e=>e.catId===this.filterCat);
      if(this.filterType!=='all') list = list.filter(e=>e.type===this.filterType);

      const today = new Date();
      const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const endOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate()+1);

      if(this.filterPeriod==='day'){
        list = list.filter(e=>{
          const d = new Date(e.date);
          return d >= startOfToday && d < endOfToday;
        });
      } else if(this.filterPeriod==='week'){
        const cutoff = new Date(startOfToday);
        cutoff.setDate(cutoff.getDate()-7);
        list = list.filter(e=> new Date(e.date) >= cutoff);
      } else if(this.filterPeriod==='month'){
        const cutoff = new Date(startOfToday);
        cutoff.setDate(cutoff.getDate()-30);
        list = list.filter(e=> new Date(e.date) >= cutoff);
      } else if(this.filterPeriod==='range'){
        if(this.customStartDate && this.customEndDate){
          const start = new Date(this.customStartDate);
          const end = new Date(this.customEndDate);
          const endPlus = new Date(end.getFullYear(), end.getMonth(), end.getDate()+1);
          list = list.filter(e=>{
            const d = new Date(e.date);
            return d >= start && d < endPlus;
          });
        }
      }
      // 'all' оставляем без дополнительной фильтрации по датам
      return list;
    },
    get periodExpenses(){
      // Базовый список без фильтров по категории/типу, только по выбранному периоду
      let list = [...this.expenses];
      const today = new Date();
      const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const endOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate()+1);

      if(this.filterPeriod==='day'){
        list = list.filter(e=>{
          const d = new Date(e.date);
          return d >= startOfToday && d < endOfToday;
        });
      } else if(this.filterPeriod==='week'){
        const cutoff = new Date(startOfToday);
        cutoff.setDate(cutoff.getDate()-7);
        list = list.filter(e=> new Date(e.date) >= cutoff);
      } else if(this.filterPeriod==='month'){
        const cutoff = new Date(startOfToday);
        cutoff.setDate(cutoff.getDate()-30);
        list = list.filter(e=> new Date(e.date) >= cutoff);
      } else if(this.filterPeriod==='range'){
        if(this.customStartDate && this.customEndDate){
          const start = new Date(this.customStartDate);
          const end = new Date(this.customEndDate);
          const endPlus = new Date(end.getFullYear(), end.getMonth(), end.getDate()+1);
          list = list.filter(e=>{
            const d = new Date(e.date);
            return d >= start && d < endPlus;
          });
        }
      }
      return list;
    },
    get monthTotal(){
      const cents = this.periodExpenses.reduce((s,e)=>{ const v=this.liveBaseAmount(e); return v===null?s:s+this.toCents(v); },0);
      return this.fromCents(cents);
    },
    get unresolvedCount(){ return this.periodExpenses.filter(e => this.liveBaseAmount(e) === null).length; },
    get oneTimeTotal(){
      const cents = this.periodExpenses.filter(e=>e.type==='one').reduce((s,e)=>{ const v=this.liveBaseAmount(e); return v===null?s:s+this.toCents(v); },0);
      return this.fromCents(cents);
    },
    get recurringTotal(){
      const cents = this.periodExpenses.filter(e=>e.type==='recurring').reduce((s,e)=>{ const v=this.liveBaseAmount(e); return v===null?s:s+this.toCents(v); },0);
      return this.fromCents(cents);
    },
    get categoryBreakdown(){
      const map = {};
      this.periodExpenses.forEach(e=>{
        const v = this.liveBaseAmount(e);
        if(v === null) return;
        map[e.catId] = (map[e.catId]||0) + this.toCents(v);
      });
      return Object.entries(map).map(([catId,cents])=>({catId, total:this.fromCents(cents), cat:this.catInfo(catId)})).sort((a,b)=>b.total-a.total);
    },
    selfTestFx(){
      let ok = true;
      const saved = this.fxTrades;
      this.fxTrades = [
        { fromCurrency:'RUB', fromAmount:55000, toCurrency:'EUR', toAmount:500 },
        { fromCurrency:'EUR', fromAmount:7000,  toCurrency:'RSD', toAmount:663000 }
      ];
      const rubToEur = this.findFxRate('RUB','EUR');
      const eurToRsd = this.findFxRate('EUR','RSD');
      const rubToRsd = this.findFxRate('RUB','RSD');
      const rsdToRub = this.findFxRate('RSD','RUB');
      const t1 = rubToEur!==null && eurToRsd!==null && rubToRsd!==null && rsdToRub!==null
        && Math.abs(rubToRsd - rubToEur*eurToRsd) < 1e-9 && Math.abs(rubToRsd*rsdToRub - 1) < 1e-9;
      console.log(t1?'✅ Тест 1 PASSED':'❌ Тест 1 FAILED', {rubToEur,eurToRsd,rubToRsd,rsdToRub});
      ok = ok && t1;
      const noPath = this.findFxRate('USD','GEL');
      const t2 = noPath === null;
      console.log(t2?'✅ Тест 2 PASSED':'❌ Тест 2 FAILED', {noPath});
      ok = ok && t2;
      this.fxTrades = saved;
      console.log(ok?'✅✅ ВСЕ ТЕСТЫ ПРОШЛИ':'❌ ЕСТЬ ОШИБКИ');
      return ok;
    },
    get recurringList(){
      const seen = {};
      this.expenses.filter(e=>e.type==='recurring').forEach(e=>{
        if(!seen[e.catId] || new Date(e.date) > new Date(seen[e.catId].date)) seen[e.catId] = e;
      });
      return Object.values(seen);
    },
    fmt(n, cur){
      if(n===undefined||n===null||isNaN(n)) return '—';
      const sym = CUR_SYMBOL[cur]||cur;
      return n.toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' ' + sym;
    },
    renderChart(){
      const canvas = document.getElementById('catChart');
      if(!canvas) return;
      if(this.chart) this.chart.destroy();
      const bd = this.categoryBreakdown;
      if(!bd.length) return;
      const colors = ['#01696f','#da7101','#7a39bb','#d19900','#006494','#a12c7b','#437a22','#964219','#28251d'];
      this.chart = new Chart(canvas, {
        type:'doughnut',
        data:{ labels: bd.map(b=>b.cat.name), datasets:[{ data: bd.map(b=>b.total), backgroundColor: colors, borderWidth:0 }] },
        options:{ plugins:{ legend:{ position:'bottom', labels:{ color: getComputedStyle(document.documentElement).getPropertyValue('--color-text'), boxWidth:12, font:{size:11} } } }, cutout:'62%' }
      });
    }
  }));
});
</script>

        <div class="stack" style="margin-top:8px">
          <p class="faint">Например: отдали 663000 RUB, получили 7000 EUR.</p>

            <span class="field-label">Отдали (валюта продажи)</span>

          </div>
          <div>
            <span class="field-label">Сумма покупки</span>
            <input class="input" type="number" inputmode="decimal" placeholder="7000" x-model="newFx.toAmount">
          </div>
          <div>
            <span class="field-label">Дата обмена</span>
            <input class="input" type="date" x-model="newFx.date">
          </div>
          <button class="btn-primary" @click="submitFx()" :disabled="fxSaving || !newFx.fromAmount || !newFx.toAmount || newFx.fromCurrency===newFx.toCurrency">
            <span x-text="fxSaving ? 'Сохранение…' : 'Сохранить курс'"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" x-show="toastMsg" x-cloak x-text="toastMsg" x-transition></div>

</div>

<script>

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('[app] Service Worker зарегистрирован:', reg.scope);
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if(newWorker){
            newWorker.addEventListener('statechange', () => {
              console.log('[app] SW state:', newWorker.state);
            });
          }
        });
      })
      .catch(err => {
        console.error('[app] Не удалось зарегистрировать Service Worker:', err);
      });
  });

  // Если контроллер сменился (обновилась версия SW), тихо перезагружаем
  // страницу один раз, чтобы новая версия сразу начала обслуживать запросы.
  let refreshingPage = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(refreshingPage) return;
    refreshingPage = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
